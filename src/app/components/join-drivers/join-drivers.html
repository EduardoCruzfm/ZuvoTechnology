        <svg viewBox="0 0 100 100" preserveAspectRatio="none">
          <path d="M0,100 C30,80 70,80 100,100 L100,0 L0,0 Z" fill="rgba(191,255,0,0.03)"/>
          <path d="M0,100 C20,70 80,70 100,100" stroke="var(--zuvo-lime)" stroke-width="0.5" fill="none" opacity="0.2"/>
