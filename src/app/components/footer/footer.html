<footer class="footer">
  <div class="footer__container container">
    <div class="footer__top">
      <div class="footer__brand">
        <a href="#inicio" class="footer__logo" (click)="scrollTo($event, '#inicio')">ZUVO</a>
        <p class="footer__tagline">Tecnología para moverte mejor.</p>
      </div>
      
      <div class="footer__nav">
        <ul>
          @for (link of navLinks; track link.href) {
            <li>
              <a [href]="link.href" (click)="scrollTo($event, link.href)">{{ link.label }}</a>
            </li>
          }
        </ul>
      </div>
    </div>
    
    <div class="footer__bottom">
      <p class="footer__copyright">
        &copy; 2026 Zuvo Technology. Todos los derechos reservados.
      </p>
      
      <div class="footer__social">
        <a href="https://www.instagram.com/zuvotechnology?utm_source=qr&igsh=ZmI4M2NkYzYzeDFj" aria-label="Instagram">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
        </a>
        <a href="#" aria-label="X (Twitter)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l11.733 16h4.267l-11.733 -16z"/><path d="M4 20l6.768 -6.768m2.46 -2.46l6.772 -6.772"/></svg>
        </a>
        <a href="https://www.linkedin.com/in/micael-martinez-226b669b" aria-label="LinkedIn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
        </a>
      </div>
    </div>
  </div>
</footer>
